<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INViSU Preservation Reader</title>
<style>
  :root{--bg:#111315;--panel:#181b1f;--line:#2a2f36;--text:#e8e6e1;--muted:#9aa0a6;--accent:#d8b36a;
        --ok:#3fb950;--mem:#d29922;--not:#58a6ff;--unk:#bc8cff;--off:#f85149}
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
  header{display:flex;align-items:baseline;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:16px;margin:0;letter-spacing:.3px} header h1 span{color:var(--accent)}
  header .sub{color:var(--muted);font-size:12.5px} header .right{margin-left:auto;color:var(--muted);font-size:12px}
  main{flex:1;display:grid;grid-template-columns:270px 1fr 400px;min-height:0}
  aside,section{min-height:0;overflow:auto}
  #list{border-right:1px solid var(--line);background:var(--panel)}
  .filters{display:flex;gap:6px;padding:8px;position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line)}
  .filters button{flex:1;background:#20242a;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:4px 0;cursor:pointer;font-size:12px}
  .filters button.on{color:var(--text);border-color:var(--accent)}
  .pg{display:flex;gap:10px;padding:8px;border-bottom:1px solid var(--line);cursor:pointer}
  .pg:hover{background:#1f2328} .pg.sel{background:#23282f;box-shadow:inset 3px 0 0 var(--accent)}
  .pg img{width:64px;height:64px;object-fit:contain;background:#000;border:1px solid var(--line);flex:none}
  .pg .id{font-weight:600;font-size:12.5px} .pg .t{color:var(--muted);font-size:12px;line-height:1.3}
  .badge{display:inline-block;font-size:10px;padding:0 5px;border-radius:4px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:1px}
  #center{display:flex;flex-direction:column}
  #pagehead{padding:8px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
  #pagehead b{font-size:15px} #pagehead .muted{color:var(--muted);font-size:12.5px} #pagehead a{color:var(--accent);font-size:12px}
  #stage{flex:1;overflow:auto;padding:12px;background:#0b0c0e}
  #wrap{position:relative;display:inline-block;max-width:100%}
  #img{display:block;max-width:100%;height:auto;background:#fff}
  .box{position:absolute;border:2px solid var(--accent);background:rgba(216,179,106,.18);pointer-events:none;border-radius:2px}
  .box.r{border-color:var(--ok);background:rgba(63,185,80,.18)}
  #ask{border-left:1px solid var(--line);background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:10px}
  textarea{width:100%;min-height:64px;background:#0f1114;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;resize:vertical}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button.go{background:var(--accent);color:#111;border:0;border-radius:8px;padding:8px 16px;font-weight:600;cursor:pointer}
  button.go:disabled{opacity:.5;cursor:wait}
  .chip{background:#20242a;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
  .chip:hover{color:var(--text);border-color:var(--accent)}
  #outcome{display:inline-block;font-weight:700;font-size:12px;letter-spacing:.5px;padding:3px 10px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
  #outcome.ANSWERED{color:var(--ok);border-color:var(--ok)} #outcome.ANSWERED_FROM_MEMORY{color:var(--mem);border-color:var(--mem)}
  #outcome.NOT_IN_THE_SET{color:var(--not);border-color:var(--not)} #outcome.UNKNOWN_ENTITY{color:var(--unk);border-color:var(--unk)}
  #outcome.MODEL_UNAVAILABLE,#outcome.UNPARSED{color:var(--off);border-color:var(--off)}
  #answer{white-space:pre-wrap;background:#0f1114;border:1px solid var(--line);border-radius:8px;padding:10px;min-height:60px}
  .receipt{background:#1b2a1e;border:1px solid var(--ok);color:var(--ok);border-radius:6px;padding:3px 9px;font-size:12.5px;cursor:pointer;font-weight:600}
  .receipt.bad{background:#2a1b1b;border-color:var(--off);color:var(--off)}
  .meta{color:var(--muted);font-size:12px}
  h3{margin:8px 0 4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  #hits .h{padding:4px 0;border-bottom:1px dashed var(--line);cursor:pointer;font-size:12.5px} #hits .h b{color:var(--accent)}
  #hits .h:hover{background:#1f2328}
  #reading{white-space:pre-wrap;font-size:12px;color:var(--muted);background:#0f1114;border:1px solid var(--line);border-radius:8px;padding:8px;max-height:220px;overflow:auto}
  @media (max-width:1000px){main{grid-template-columns:1fr}#list{max-height:200px}#ask{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1><span>INViSU</span> Preservation Reader</h1>
  <div class="sub" id="setname">loading set…</div>
  <div class="right" id="models"></div>
</header>
<main>
  <aside id="list">
    <div class="filters">
      <button class="on" data-k="all">All</button><button data-k="sheet">Sheets</button>
      <button data-k="photo">Photos</button><button data-k="document">Documents</button>
    </div>
    <div id="pages"></div>
  </aside>
  <section id="center">
    <div id="pagehead"><b id="ptitle">—</b><span class="muted" id="pmeta"></span><a id="full" target="_blank" rel="noopener">full resolution</a></div>
    <div id="stage"><div id="wrap"><img id="img" alt="selected page"><div id="overlay"></div></div></div>
  </section>
  <aside id="ask">
    <textarea id="q" placeholder="Ask the set — e.g. where is the throne room"></textarea>
    <div class="row">
      <button class="go" id="go">Ask</button>
      <span class="meta" id="status"></span>
    </div>
    <div class="row" id="examples"></div>
    <div class="row"><span id="outcome">—</span><span class="meta" id="verified"></span></div>
    <div id="answer">Pick a page on the left, or ask a question. Answers come from Nemotron-3-Ultra over the index; every answer carries the page it came from, and when the set does not say, it says so.</div>
    <div class="row" id="receipts"></div>
    <div class="meta" id="meta"></div>
    <h3>Index hits <span id="hitcount"></span></h3>
    <div id="hits"></div>
    <h3>Page text, reading order</h3>
    <div id="reading">—</div>
  </aside>
</main>
<script>
const S = {pages:[], byId:{}, sel:null, filter:'all', hits:{}, receipts:[]};
const $ = id => document.getElementById(id);
const EXAMPLES = ['where is the throne room','which sheets show the Richards Street elevation',
                  'what does sheet 12 reference','what wood species is the central stair balustrade'];

async function load(){
  const d = await (await fetch('/api/set')).json();
  S.pages = d.pages; S.byId = Object.fromEntries(d.pages.map(p=>[p.id,p]));
  const s = d.summary;
  $('setname').textContent = `${d.name} · ${s.pages} pages: ${s.documents} documents, ${s.sheets} sheets, ${s.photos} photographs · ${s.texts} text entries (${s.texts_eyes} read from scans)`;
  $('models').textContent = `eyes ${d.eyes.split('/')[1]} · brain ${d.model.split('/')[1]} · Nebius Token Factory` + (d.model_note ? ` · ${d.model_note}` : '');
  for (const ex of EXAMPLES){ const c=document.createElement('span'); c.className='chip'; c.textContent=ex; c.onclick=()=>{$('q').value=ex; ask();}; $('examples').appendChild(c); }
  renderList();
  const first = S.pages.find(p=>p.kind==='sheet' && p.texts>0) || S.pages.find(p=>p.kind==='sheet') || S.pages[0];
  if (first) select(first.id);
}
function renderList(){
  const el = $('pages'); el.innerHTML='';
  for (const p of S.pages){
    if (S.filter!=='all' && p.kind!==S.filter) continue;
    const d = document.createElement('div'); d.className='pg'+(p.id===S.sel?' sel':''); d.id='li-'+p.id;
    const habs = p.habs_no ? `<span class="badge">HABS sheet ${p.habs_no}</span>` : '';
    d.innerHTML = `<img loading="lazy" src="${p.thumb_url}" alt=""><div><div class="id">${p.id}<span class="badge">${p.kind}</span>${habs}</div><div class="t">${p.title || (p.kind==='sheet' && !p.texts ? '(not read yet)' : '')}</div></div>`;
    d.onclick = ()=>select(p.id);
    el.appendChild(d);
  }
}
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); S.filter=b.dataset.k; renderList();});

async function select(id){
  S.sel = id; const p = S.byId[id]; if(!p) return;
  document.querySelectorAll('.pg').forEach(x=>x.classList.toggle('sel', x.id==='li-'+id));
  const li = $('li-'+id); if (li) li.scrollIntoView({block:'nearest'});
  $('ptitle').textContent = `${p.id} · ${p.title || '(no title read)'}`;
  $('pmeta').textContent = `${p.kind}${p.habs_no?` · HABS sheet ${p.habs_no}`:''} · ${p.width}×${p.height} px · ${p.texts} text entries`;
  $('full').href = p.image_url;
  $('overlay').innerHTML='';
  $('img').src = p.view_url;
  const det = await (await fetch('/api/page/'+id)).json();
  p.detail = det;
  const refs = det.refs.map(r=>`${r.text} → ${r.points_to||'?'}`).join(' · ');
  const back = det.referenced_by.map(r=>`${r.sheet}: ${r.text}`).join(' · ');
  $('reading').textContent = (refs?`References: ${refs}\n`:'') + (back?`Referenced by: ${back}\n`:'') + (det.issues.length?`Check: ${det.issues.join(' | ')}\n`:'') + (det.reading_order || '(nothing read on this page yet)');
  drawBoxes();
}
function drawBoxes(){
  const p = S.byId[S.sel]; const img=$('img'); const ov=$('overlay'); ov.innerHTML='';
  if(!p || !img.clientWidth) return;
  const sx = img.clientWidth/p.width, sy = img.clientHeight/p.height;
  const isReceipt = S.receipts.includes(p.id);
  for (const h of (S.hits[p.id]||[])){
    const [x1,y1,x2,y2]=h.bbox; if (x2-x1<=0 && y2-y1<=0) continue;
    const b=document.createElement('div'); b.className='box'+(isReceipt?' r':'');
    b.style.left=(x1*sx-3)+'px'; b.style.top=(y1*sy-3)+'px'; b.style.width=((x2-x1)*sx+6)+'px'; b.style.height=((y2-y1)*sy+6)+'px';
    b.title=h.text; ov.appendChild(b);
  }
}
$('img').onload = drawBoxes; window.onresize = drawBoxes;

function groupHits(hits){ const g={}; for (const h of hits){ (g[h.sheet] ||= []).push(h); } return g; }

async function ask(){
  const q = $('q').value.trim(); if(!q) return;
  $('go').disabled=true; $('status').textContent='asking Nemotron-3-Ultra…'; $('outcome').className=''; $('outcome').textContent='…';
  $('answer').textContent=''; $('receipts').innerHTML=''; $('meta').textContent=''; $('verified').textContent='';
  try{
    const r = await (await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q, sheet_id:S.sel})})).json();
    S.hits = groupHits(r.hits||[]); S.receipts = r.receipts||[];
    $('outcome').textContent = r.outcome.replaceAll('_',' '); $('outcome').className = r.outcome;
    $('answer').textContent = r.answer || '';
    $('verified').textContent = r.available ? (r.verified ? 'receipts verified against the index' : (r.notes||[]).join('; ')) : '';
    for (const id of S.receipts){ const c=document.createElement('span'); c.className='receipt'+(S.byId[id]?'':' bad'); c.textContent=id+(S.byId[id]&&S.byId[id].title?` · ${S.byId[id].title}`:''); c.onclick=()=>select(id); $('receipts').appendChild(c); }
    if (r.available && r.usage) $('meta').textContent = `${r.model} · ${r.usage.prompt_tokens} in / ${r.usage.completion_tokens} out · ${r.latency_s}s · evidence pack ${r.pack_chars} chars` + (r.usd!=null?` · $${r.usd.toFixed(4)}`:'');
    else if (!r.available) $('meta').textContent = 'The index below still works: hits are from the committed index, no model involved.';
    renderHits(r);
    if (S.receipts.length && S.byId[S.receipts[0]] && !S.receipts.includes(S.sel)) select(S.receipts[0]); else if (r.top_sheet && !r.available && S.byId[r.top_sheet]) select(r.top_sheet); else drawBoxes();
  }catch(e){ $('outcome').textContent='ERROR'; $('outcome').className='MODEL_UNAVAILABLE'; $('answer').textContent=String(e); }
  $('go').disabled=false; $('status').textContent='';
}
function renderHits(r){
  const el=$('hits'); el.innerHTML=''; const sheets=r.sheets||[];
  $('hitcount').textContent = sheets.length ? `· ${(r.hits||[]).length} on ${sheets.length} pages for ${(r.roots||[]).join(', ')}` : (r.roots&&r.roots.length?`· none for ${r.roots.join(', ')}`:'');
  for (const s of sheets.slice(0,20)){
    const p=S.byId[s.id]; const ex=(S.hits[s.id]||[]).slice(0,3).map(h=>h.text.length>60?h.text.slice(0,60)+'…':h.text).join(' · ');
    const d=document.createElement('div'); d.className='h'; d.innerHTML=`<b>${s.id}</b> ×${s.count}${p&&p.title?` — ${p.title}`:''}<br><span class="meta">${ex}</span>`; d.onclick=()=>select(s.id); el.appendChild(d);
  }
}
$('go').onclick = ask; $('q').addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); ask(); }});
load();
</script>
</body>
</html>
